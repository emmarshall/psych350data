url: https://emmarshall.github.io/psych350data/
template:
  bootstrap: 5
  bslib:
    bootswatch: materia
    bg: "#F5F5F5"
    fg: "#072e3c"
    primary: "#ff6361"
    base_font: {google: "Sora"}
    heading_font: {google: "Sora"}
navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
reference:
  - title: Datasets
    desc: All available datasets for PSYC 350 labs and final projects
    contents:
      - superman
      - superman_smes
      - superman_movies
      - hot_ones
      - tip_jokes
      - mcu
      - mock_jury
      - candy
      - candy_simple
      - football
      - huskers
      - interpersonal_data
      - self_descriptive_data
  - title: Data Utilities
    desc: Functions for working with datasets
    contents:
      - join_superman_data
  - title: Generic Export Functions
    desc: Export any dataset as an SPSS .sav file
    contents:
      - export_sav
      - export_all_sav
      - list_datasets
  - title: Dataset-Specific Export Functions
    desc: Convenience functions to export individual datasets
    contents:
      - export_superman_sav
      - export_superman_smes_sav
      - export_superman_movies_sav
      - export_hot_ones_sav
      - export_tip_jokes_sav
      - export_mcu_sav
