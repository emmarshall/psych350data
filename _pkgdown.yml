url: https://emmarshall.github.io/psych350data/
template:
  bootstrap: 5
  bslib:
    bootswatch: materia
    bg: "#F5F5F5"
    fg: "#072e3c"
    primary: "#ff6361"
    base_font: {google: "IBM Plex Sans"}
    heading_font: {google: "Newsreader"}
navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: Getting Started
          href: articles/getting-started.html
        - text: Exporting to SPSS
          href: articles/exporting-spss.html
        - text: Dataset Reference Guide
          href: articles/dataset-guide.html
    github:
      icon: fa-github
      href: https://github.com/emmarshall/psych350data
      aria-label: GitHub
reference:
  - title: Datasets
    desc: All available datasets for PSYC 350 labs and final projects
    contents:
      - superman
      - superman_smes
      - hot_ones
      - tip_jokes
      - mcu
      - mock_jury
      - candy
      - candy_simple
      - football
      - interpersonal_data
      - self_descriptive_data
  - title: Generic Export Functions
    desc: Export any dataset as an SPSS .sav file
    contents:
      - export_sav
      - export_all_sav
      - list_datasets
  - title: Dataset-Specific Export Functions
    desc: Convenience functions to export individual datasets
    contents:
      - export_superman_sav
      - export_superman_smes_sav
      - export_hot_ones_sav
      - export_tip_jokes_sav
      - export_mcu_sav
      - export_mock_jury_sav
      - export_candy_sav
      - export_candy_simple_sav
      - export_football_sav
      - export_interpersonal_sav
      - export_selfdescriptive_sav
